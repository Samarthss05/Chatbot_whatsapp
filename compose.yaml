services:
  ledger:
    build: .
    init: true
    env_file: .env
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: 3000
      DB_FILE: /app/data/ledgerbot.db
      DRY_RUN: "0"
    ports:
      - "127.0.0.1:3000:3000"
    volumes:
      - ledger-data:/app/data
    restart: unless-stopped
    stop_grace_period: 35s
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
volumes:
  ledger-data:

name: Validate booking service
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npm run format:check
      - run: npm run check
      - run: npm test
      - run: npm run simulate
      - run: npm audit --omit=dev --audit-level=high
      - run: docker build --tag ledger-booking-bot:ci .
      - run: docker run --rm --network none ledger-booking-bot:ci node scripts/simulate.js
